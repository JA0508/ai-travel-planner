name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Workspace tests
        run: npm run test:workspace

      - name: Build
        run: npm run build

  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install document extraction system dependencies
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-eng tesseract-ocr-chi-sim fonts-noto-cjk

      - name: Verify document OCR capabilities
        run: |
          which tesseract
          tesseract --version
          tesseract --list-langs

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Test
        env:
          REQUIRE_PRODUCTION_OCR_SMOKE: "1"
        run: python -m unittest discover -s tests -t .

      - name: Planner evaluation
        run: python -m tools.run_planner_evaluation --ci

      - name: Trip mutation evaluation
        run: python -m tools.run_trip_mutation_evaluation --ci

      - name: Import evaluation
        run: python -m tools.run_import_evaluation --ci
